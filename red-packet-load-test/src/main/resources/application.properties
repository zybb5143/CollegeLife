# ============================================================
# 抢红包压测配置文件
# ============================================================

# 服务端口（压测工具本身不需要对外提供服务，设置一个不冲突的端口）
server.port=19999

# ============================================================
# 压测目标配置
# ============================================================

# 目标服务基础URL（抢红包接口所在的服务地址）
loadtest.base-url=http://localhost:10010

# Redis版本抢红包接口路径（写死）
loadtest.redis-grab-path=/api/redpacket/grab

# MySQL版本抢红包接口路径（写死）
loadtest.mysql-grab-path=/api/mysql/redpacket/grab

# ============================================================
# 压测参数配置
# ============================================================

# 红包编号（需要提前在目标服务上发布好该红包）
loadtest.packet-no=TEST_PACKET_001

# 并发线程数（模拟同时抢红包的用户数量）
loadtest.concurrency=100

# 总请求数（总共发起多少次抢红包请求）
loadtest.total-requests=500

# 用户名前缀（实际用户名为: 前缀_版本_序号）
loadtest.user-name-prefix=testUser

# ============================================================
# 压测开关
# ============================================================

# 是否启用Redis版本压测
loadtest.enable-redis=true

# 是否启用MySQL版本压测
loadtest.enable-mysql=true

# auto run on startup (false = trigger from web page manually)
loadtest.auto-run=false

# ============================================================
# 高级配置
# ============================================================

# 压测前预热请求数（让JVM和目标服务热身）
loadtest.warmup-requests=5

# HTTP连接超时（毫秒）
loadtest.connect-timeout=5000

# HTTP读取超时（毫秒）
loadtest.read-timeout=10000

# ============================================================
# 日志配置
# ============================================================
logging.level.com.shengda=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
