server.port=10010
spring.application.name=shengda-app-10010
spring.datasource.url=jdbc:mysql://localhost:3306/shengda?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:111111}
mybatis.mapper-locations=classpath:mapper/*.xml
# HS512 要求密钥不短于 64 字节；生产环境用环境变量 JWT_SECRET 注入
jwt.secret=${JWT_SECRET:shengda-college-life-demo-jwt-secret-please-replace-with-your-512-bit-key}

# 文件上传大小限制（发帖附件/网盘文件）
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# AI 服务商配置：密钥一律走环境变量，仓库里不留真实 key
# 没有 key 时 AI 相关逻辑自动放行（帖子照常发布、聊天返回提示）
# Doubao AI
doubao.api.key=${DOUBAO_API_KEY:}
doubao.model=doubao-lite-32k

# DeepSeek AI
deepseek.api.key=${DEEPSEEK_API_KEY:}
deepseek.model=deepseek-flash

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0


# 绞杀者迁移：开启 Nacos 服务发现以便 Feign 定位 shengda-tie-service，单体自身仍不注册进 Nacos
spring.cloud.service-registry.auto-registration.enabled=false
spring.cloud.nacos.discovery.enabled=true
spring.cloud.nacos.discovery.server-addr=localhost:8848